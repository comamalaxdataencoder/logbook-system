<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: sans-serif; padding: 10px; background: #f4f7f6; margin: 0; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 450px; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h2 { font-size: 1.2rem; text-align: center; margin-top: 0; }
    select, input, textarea, button { width: 100%; padding: 14px; margin: 6px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
    textarea { resize: vertical; height: 90px; font-family: sans-serif; }
    button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .radio-group { display: flex; justify-content: space-around; padding: 10px 0; font-size: 1.1rem; }
    #reader { width: 100%; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Logbook System</h2>
    <select id="formSelect" onchange="showForm()">
      <option value="EmployeeLogs">Employee</option>
      <option value="VisitorLogs">Visitor</option>
      <option value="PickupLogs">Pickup</option>
      <option value="RTSLogs">RTS</option>
      <option value="DeliveryParcelLogs">Delivery</option>
      <option value="Device">Device</option>
    </select>
    <div id="fields"></div>
    <div class="radio-group" id="radioGroup">
      <label><input type="radio" name="action" value="IN" checked> IN</label>
      <label><input type="radio" name="action" value="OUT"> OUT</label>
    </div>
    <button id="submitBtn" onclick="submitForm()">SUBMIT</button>
  </div>

  <script>
    let html5QrCode = null;

    function showForm() {
      // Kung lumipat ng form, siguruhing patayin ang scanner kung aktibo
      if (html5QrCode) {
        html5QrCode.stop().catch(() => {}).finally(() => {
          html5QrCode = null;
          let r = document.getElementById('reader');
          if(r) r.innerHTML = "";
        });
      }

      let type = document.getElementById('formSelect').value;
      let html = '<input id="name" placeholder="Name" required>' +
                 '<input id="contact" type="text" inputmode="numeric" placeholder="Contact #" oninput="this.value = this.value.replace(/[^0-9]/g, \'\')" required>';
      
      let radioGroup = document.getElementById('radioGroup');

      if(type === 'Device') {
        radioGroup.style.display = "flex";
        html += '<div id="reader"></div>' +
                '<button type="button" onclick="startScanner()">SCAN SERIAL BARCODE</button>' +
                '<button type="button" onclick="stopScanner()" style="background: #dc3545; margin-top: 5px;">CLOSE CAMERA</button>' +
                '<textarea id="serial" placeholder="I-scan o i-type ang mga Serial Numbers dito (bawat isa ay sa bagong linya)" required></textarea>' +
                '<input id="dept" placeholder="Department">' +
                '<label style="font-size: 14px; font-weight: bold; margin-top: 5px; display: block;">Out Location:</label>' +
                '<select id="outVal"><option value="WHS 1103">WHS 1103</option><option value="WHS 1104">WHS 1104</option><option value="OFFICE 1101">OFFICE 1101</option></select>' +
                '<label style="font-size: 14px; font-weight: bold; margin-top: 5px; display: block;">In Location:</label>' +
                '<select id="inVal"><option value="WHS 1103">WHS 1103</option><option value="WHS 1104">WHS 1104</option><option value="OFFICE 1101">OFFICE 1101</option></select>';
      } else if(type === 'EmployeeLogs' || type === 'VisitorLogs') {
        radioGroup.style.display = "flex";
        html += '<input id="dept" placeholder="Department"><select id="whs"><option value="WHS 1103">WHS 1103</option><option value="WHS 1104">WHS 1104</option><option value="OFFICE 1101">OFFICE 1101</option></select><input id="remarks" placeholder="Remarks">';
      } else if(type === 'PickupLogs') {
        radioGroup.style.display = "flex";
        html += '<select id="platform"><option>SPX</option><option>Flash Express</option><option>J&T Express</option><option>Ninja Van</option><option>LEX</option><option>Gogo Xpress</option><option>INSTANT</option><option>J&T Cargo</option></select>';
      } else if(type === 'RTSLogs') {
        radioGroup.style.display = "flex";
        html += '<div id="reader"></div><input id="tracking" placeholder="Tracking Number"><button type="button" onclick="startScannerRTS()">SCAN BARCODE</button>' +
                '<button type="button" onclick="stopScanner()" style="background: #dc3545; margin-top: 5px;">CLOSE CAMERA</button>' +
                '<input id="qty" type="text" inputmode="numeric" placeholder="Qty" oninput="this.value = this.value.replace(/[^0-9]/g, \'\')">' +
                '<input id="recBy" placeholder="Received By"><input id="remarks" placeholder="Remarks">';
      } else if(type === 'DeliveryParcelLogs') {
        radioGroup.style.display = "flex";
        html += '<input id="dept" placeholder="Department"><input id="forWho" placeholder="Who is this for?">' +
                '<input id="qty" type="text" inputmode="numeric" placeholder="Qty" oninput="this.value = this.value.replace(/[^0-9]/g, \'\')">' +
                '<select id="platform"><option>Lazada</option><option>Tiktok</option><option>Shopee</option><option>Others</option></select>' +
                '<input id="recBy" placeholder="Received By"><input id="checkBy" placeholder="Checked By"><input id="remarks" placeholder="Remarks">';
      }
      document.getElementById('fields').innerHTML = html;
    }

    function startScanner() {
      if (html5QrCode) { return; } // Kung bukas na, huwag nang magbukas ulit
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 },
        (decodedText) => {
          let serialField = document.getElementById('serial');
          // Para maiwasan ang sunud-sunod na pag-scan ng iisang serial nang mabilis
          let lines = serialField.value.split("\n");
          if (lines[lines.length - 1] !== decodedText) {
            if (serialField.value.trim() === "") {
              serialField.value = decodedText;
            } else {
              serialField.value += "\n" + decodedText;
            }
          }
        }
      ).catch(err => { alert("Error sa camera: " + err); });
    }

    function startScannerRTS() {
      if (html5QrCode) { return; }
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 },
        (decodedText) => {
          document.getElementById('tracking').value = decodedText;
          stopScanner();
        }
      ).catch(err => { alert("Error sa camera: " + err); });
    }

    function stopScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode = null;
          let r = document.getElementById('reader');
          if(r) r.innerHTML = "";
        }).catch(() => {
          html5QrCode = null;
          let r = document.getElementById('reader');
          if(r) r.innerHTML = "";
        });
      } else {
        let r = document.getElementById('reader');
        if(r) r.innerHTML = "";
      }
    }

    function submitForm() {
      stopScanner(); // Patayin ang camera bago mag-submit para walang naiwang proseso

      let fields = document.querySelectorAll('#fields input, #fields select, #fields textarea');
      let isValid = true;
      fields.forEach(el => {
        if (el.value.trim() === "" && el.id !== "reader") { isValid = false; el.style.border = "2px solid red"; } 
        else { el.style.border = "1px solid #ccc"; }
      });

      if (!isValid) { alert("Pakikumpleto muna ang mga kinakailangang field bago mag-submit."); return; }

      let btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.innerText = "Nagse-send...";
      let data = { formType: document.getElementById('formSelect').value, action: document.querySelector('input[name="action"]:checked').value };
      fields.forEach(el => { if(el.id) data[el.id] = el.value; });

      fetch("https://script.google.com/macros/s/AKfycbxCOrwQHLQEJs49sesa8aV1UKxf6HUhravwgPhg6W0gqaiMF3INZyDkoC1V0XFRxyONRA/exec", {
        method: "POST",
        body: JSON.stringify(data)
      })
      .then(r => r.text()).then(t => { 
        alert("Resulta: " + t); 
        btn.disabled = false; btn.innerText = "SUBMIT"; 
        fields.forEach(el => { if(el.id !== "reader") el.value = ""; }); 
      })
      .catch(e => { alert("Error: " + e); btn.disabled = false; btn.innerText = "SUBMIT"; });
    }
    showForm();
  </script>
</body>
</html>
